# Fly.io settings for the live site. deploy/publish.py fills in the app name.
app = "APP_NAME"
primary_region = "yyz"  # Toronto

[http_service]
  internal_port = 8080
  force_https = true
  # Never stop: the site stays up even when nobody is visiting.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # At most 100 requests at once, so a flood of bots can't run the server out of memory.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
