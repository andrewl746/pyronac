# Fly.io settings for the live site. deploy/publish.py fills in the app name.
app = "APP_NAME"
primary_region = "yyz"  # Toronto

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend when nobody is visiting and resume on the next request. Fly freezes the server with its memory
  # as it is (possible up to 2 GB of memory) and resumes it in about a second, so only the time someone is
  # visiting is paid for.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # At most 100 requests at once, so a flood of bots can't run the server out of memory.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# If the app ever crashes, start it again, however many times (Fly's default gives up after 10).
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
